{% extends 'components/modal_form.html' %}
{% load ui %}
{% block cuerpo %}
<div class="form-grid">
    {% campo form.hora icono="ph ph-clock" %}
    {% campo form.titulo icono="ph ph-text-t" %}
    <div class="field span-2">
        <span class="field__label">Ícono</span>
        <div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(92px,1fr))">
            {% for radio in form.icono %}
            <label class="tile">{{ radio.tag }}
                <span class="tile__body" style="padding:10px 6px;font-size:12px">
                    {% if radio.data.value == 'ceremonia' %}<i class="ph ph-church"></i>{% elif radio.data.value == 'recepcion' %}<i class="ph ph-door-open"></i>{% elif radio.data.value == 'cena' %}<i class="ph ph-fork-knife"></i>{% elif radio.data.value == 'brindis' %}<i class="ph ph-wine"></i>{% elif radio.data.value == 'vals' %}<i class="ph ph-music-notes"></i>{% elif radio.data.value == 'fotos' %}<i class="ph ph-camera"></i>{% elif radio.data.value == 'fiesta' %}<i class="ph ph-vinyl-record"></i>{% elif radio.data.value == 'pastel' %}<i class="ph ph-cake"></i>{% else %}<i class="ph ph-star"></i>{% endif %}
                    {{ radio.choice_label }}
                </span>
            </label>
            {% endfor %}
        </div>
    </div>
    {% campo form.descripcion icono="ph ph-map-pin" clase="span-2" %}
</div>
{% endblock %}
