{% if fotos %}
<div class="galeria-editor">
    {% for f in fotos %}
    <figure>
        <img src="{{ f.imagen.url }}" alt="" loading="lazy">
        <div class="galeria-editor__acciones">
            <button type="button" data-post="{% url 'invitaciones:elemento_mover' 'galeria' f.pk 'arriba' %}" {% if forloop.first %}disabled{% endif %} aria-label="Mover antes"><i class="ph ph-caret-left"></i></button>
            <button type="button" data-post="{% url 'invitaciones:elemento_mover' 'galeria' f.pk 'abajo' %}" {% if forloop.last %}disabled{% endif %} aria-label="Mover después"><i class="ph ph-caret-right"></i></button>
            <button type="button" class="es-borrar" data-post="{% url 'invitaciones:elemento_eliminar' 'galeria' f.pk %}" data-confirm="¿Quitar esta foto?" data-danger data-confirm-button="Quitar" aria-label="Eliminar"><i class="ph ph-trash"></i></button>
        </div>
    </figure>
    {% endfor %}
</div>
{% endif %}
<p class="field__help mt-1">{{ fotos|length }} de {{ max_fotos }} fotos.</p>
