{% load static %}{# Lo común del <head> de la invitación pública (cada plantilla agrega sus estilos) #}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ invitacion.titulo_visible }} · {{ invitacion.nombres_visibles }}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/favicon-192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
    <meta name="description" content="{{ evento.fecha_inicio_evento|date:'l j \d\e F \d\e Y' }}{% if evento.lugar %} · {{ evento.lugar }}{% endif %}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if invitado %}{{ invitado.nombre }}, estás invitado: {% endif %}{{ invitacion.titulo_visible }} · {{ invitacion.nombres_visibles }}">
    <meta property="og:description" content="{{ evento.fecha_inicio_evento|date:'l j \d\e F' }}{% if evento.lugar %} · {{ evento.lugar }}{% endif %}. Abre tu invitación y confirma tu asistencia.">
    {% if og_imagen %}<meta property="og:image" content="{{ og_imagen }}">{% endif %}
    <meta name="theme-color" content="{{ invitacion.color_principal }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Jost:wght@300;400;500;600&family=Syne:wght@600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css" rel="stylesheet">
