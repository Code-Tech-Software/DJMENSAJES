{% load static %}<!doctype html>
<html lang="es" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="theme-color" content="#0098da">
    <title>{% block title %}Panel{% endblock %} · Grupo EM</title>
    <link rel="icon" type="image/png" href="{% static 'img/isotipo.png' %}">
    <script>
        (function () {
            try {
                // Claro por defecto; el oscuro solo si la persona lo eligió con el botón de tema
                document.documentElement.dataset.theme = localStorage.getItem('em-theme') === 'dark' ? 'dark' : 'light';
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/em.css' %}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}

{% if messages %}
<script id="django-messages" type="application/json">[{% for m in messages %}{"text": "{{ m|escapejs }}", "type": "{{ m.tags|default:'info'|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]</script>
{% endif %}
<script src="{% static 'js/em.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
