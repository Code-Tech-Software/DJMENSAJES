{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block head %}
<style>
    .error-page {
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: radial-gradient(circle at 20% 10%, var(--brand-soft), transparent 40%),
                    radial-gradient(circle at 80% 90%, var(--live-soft), transparent 40%), var(--bg);
    }
    .error-card { text-align: center; max-width: 460px; }
    .error-code {
        font-size: 120px; font-weight: 800; letter-spacing: -.06em; line-height: 1;
        background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .error-card .empty__art { margin: 0 auto 18px; }
</style>
{% endblock %}
{% block body %}
<div class="error-page">
    <div class="error-card">
        <div class="empty__art"><i class="{{ icono }}"></i></div>
        <div class="error-code">{{ codigo }}</div>
        <h1 style="font-size:24px;margin-top:8px">{{ titulo }}</h1>
        <p class="text-2 mt-1">{{ texto }}</p>
        <div class="row mt-3" style="justify-content:center">
            <button class="btn" onclick="history.back()"><i class="ri-arrow-left-line"></i>Regresar</button>
            <a class="btn btn--primary" href="/"><i class="ri-home-5-line"></i>Ir al inicio</a>
        </div>
    </div>
</div>
{% endblock %}
